
name: bd1-g03-final

services:
  db:
    image: postgres:17.11-bookworm

    environment:
      POSTGRES_USER: bd1
      POSTGRES_PASSWORD: bd1_local
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./:/workspace:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
