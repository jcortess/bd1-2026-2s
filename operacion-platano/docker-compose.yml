services:
  db:
    image: postgres:16
    container_name: platano_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: platano
      POSTGRES_PASSWORD: platano
      POSTGRES_DB: platano
    ports:
      - "5432:5432"
    volumes:
      - platano_data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./test:/test:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platano -d platano"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  platano_data:
