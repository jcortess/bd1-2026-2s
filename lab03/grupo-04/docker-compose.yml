version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: postgres_el_roble
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_contrasena_aqui
      POSTGRES_DB: alquileres_el_roble
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  pgdata: